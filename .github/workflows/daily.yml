name: Daily fetch, build and deploy

# 매일 06:30 KST에 온비드 데이터를 수집하고 사이트를 다시 만들어 배포한다.
# 수집 데이터(store/)는 저장소 용량이 늘지 않도록 orphan `data` 브랜치에 덮어써서 보관한다.
on:
  schedule:
    - cron: '30 21 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      detail_budget:
        description: '상세 보강 예산(건)'
        default: '900'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 이전 수집 데이터 복원 (data 브랜치 -> store/)
        run: |
          mkdir -p store
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/data_branch
            cp /tmp/data_branch/*.gz /tmp/data_branch/*.json store/ 2>/dev/null || true
          fi
          ls -la store

      - name: 온비드 데이터 수집 (일 상세 보강 예산 900건)
        id: fetch
        timeout-minutes: 40
        if: github.event_name != 'push' || hashFiles('store/items.json.gz') == ''
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python -u scripts/fetch_data.py --detail-budget ${{ github.event.inputs.detail_budget || 900 }}

      - name: 사이트 생성
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/build_site.py

      - name: 수집 데이터 저장 (data 브랜치 덮어쓰기)
        if: steps.fetch.outcome == 'success'
        run: |
          rm -rf /tmp/data_out && mkdir /tmp/data_out && cp store/*.gz store/*.json /tmp/data_out/
          cd /tmp/data_out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
